name: PostgreSQL concurrency tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/postgres/**'
      - '.github/workflows/postgres-concurrency.yml'

jobs:
  concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ciber_piste_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ciber_piste_pos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run isolated concurrency tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ciber_piste_pos_test
        run: bash tests/postgres/run_concurrency_test.sh
